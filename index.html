/* Layout: Vollbild-Karte (Dämmerung), oben Kasse/Hitze, unten Info-Panel + Navigation. Eine feste dunkle Spieloptik. */
:root{
  color-scheme: dark;
  --night:#26222e; --asph:#1e1c22; --asph2:#2a272f; --ink:#141214;
  --fg:#f4efe6; --mute:#b4abbd; --dim:#8d8496;
  --gold:#ffd23f; --clean:#9df7c2; --pink:#ff3fa4; --violet:#9a7bff; --cop:#5a8cff;
  --display:"Anton","Arial Narrow",Impact,sans-serif;
  --label:"Bebas Neue","Arial Narrow",sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  --body:"Onest",system-ui,-apple-system,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--night);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
svg#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#pins{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
.hud{position:fixed;z-index:6;top:0;left:0;right:0;display:flex;gap:8px;align-items:flex-start;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.hud-in{display:flex;gap:8px;align-items:flex-start;width:100%;max-width:520px}
.tape{background:var(--gold);color:var(--ink);font-family:var(--display);font-size:17px;padding:4px 10px 3px;box-shadow:0 3px 0 rgba(0,0,0,.45);white-space:nowrap;font-variant-numeric:tabular-nums;transform:rotate(-1.5deg)}
.tape small{font-family:var(--label);font-size:12px;letter-spacing:.1em;opacity:.7;margin-right:6px}
.tape.clean{background:var(--clean);transform:rotate(1.2deg)}
.heat{margin-left:auto;background:var(--asph);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--pink);padding:3px 8px 5px;transform:rotate(2deg);min-width:72px}
.heat .k{font-family:var(--label);font-size:12px;letter-spacing:.1em;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.heat .k b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--pink);letter-spacing:0}
.heat .bar{height:5px;background:#3a3540;margin-top:2px}
.heat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));width:30%;transition:width .4s}
.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.12) rotate(-1deg)}}

/* Toast */
.toasts{position:fixed;z-index:8;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;width:100%;max-width:520px;box-sizing:border-box;background:var(--asph);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--pink);padding:8px 10px;display:flex;gap:10px;align-items:center;animation:tin .35s cubic-bezier(.3,1.5,.5,1)}
.toast.good{box-shadow:4px 4px 0 #3ddc97}.toast.info{box-shadow:4px 4px 0 var(--gold)}
.toast .ic{width:28px;height:28px;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px;transform:rotate(-6deg);flex-shrink:0}
.toast.good .ic{background:#3ddc97;color:var(--ink)}.toast.info .ic{background:var(--gold);color:var(--ink)}
.toast .tx{flex:1;min-width:0}
.toast b{font-family:var(--display);font-weight:400;font-size:14px;display:block;letter-spacing:.01em}
.toast span{font-size:11.5px;color:var(--mute)}
.toast .act{background:var(--gold);color:var(--ink);border:2px solid #000;font-family:var(--display);font-size:13px;padding:5px 8px;box-shadow:2px 2px 0 #000;white-space:nowrap}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}}

/* Pins */
.pin{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%)}
.pin .c{width:32px;height:32px;border-radius:50%;background:var(--ink);border:2.5px solid var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px var(--c);transition:transform .15s}
.pin:hover .c{transform:scale(1.12)}
.pin.sel .c{background:var(--c)}.pin.sel svg{stroke:var(--ink)}
.pin svg{width:17px;height:17px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin .stem{width:2px;height:9px;background:var(--c)}
.pin .badge{font-family:var(--display);font-size:11.5px;background:var(--ink);color:var(--c);border:1.5px solid var(--c);padding:0 5px;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pin .badge.low{color:#fff;background:var(--pink);border-color:var(--pink)}
.vlab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:1px 8px;font-weight:800;font-size:11px;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);font-variant-numeric:tabular-nums}
.vlab.bad{background:var(--pink);color:#fff}
.st{position:absolute;left:0;top:0;font-family:var(--label);font-size:13px;letter-spacing:.18em;color:#e8dfcf;white-space:nowrap;text-shadow:0 0 3px var(--night),0 0 6px var(--night)}
.st.big{font-size:15px;color:#fff3c4;letter-spacing:.22em}
.float{position:fixed;z-index:7;pointer-events:none;font-family:var(--display);font-size:16px;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 2px 0 #000,0 0 8px #000;font-variant-numeric:tabular-nums}

/* Unten */
.bottom{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
  padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px))}
.panel,.nav{pointer-events:auto;width:100%;max-width:520px;box-sizing:border-box}
.panel{position:relative;background:var(--asph);border:3px solid var(--ink);box-shadow:5px 5px 0 #000;padding:12px 14px 14px;max-height:52vh;overflow-y:auto;animation:pin .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes pin{from{transform:translateY(20px);opacity:0}}
.panel .x{position:absolute;right:8px;top:8px;width:30px;height:30px;background:var(--asph2);border:2px solid #000;font-family:var(--display);font-size:15px;line-height:1}
.hd{display:flex;gap:10px;align-items:flex-start;padding-right:36px}
.hd h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1;color:var(--gold);text-shadow:2px 2px 0 #000;text-wrap:balance}
.hd .lv{font-family:var(--label);font-size:14px;letter-spacing:.1em;background:var(--pink);color:#fff;padding:2px 7px;transform:rotate(3deg);white-space:nowrap;align-self:center}
.sub{font-size:12px;color:var(--mute);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px;font-size:11.5px}
.mt{display:flex;justify-content:space-between;color:var(--mute);margin-bottom:4px}.mt b{color:var(--fg);font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--asph2);border:2px solid #000}.meter i{display:block;height:100%;transition:width .3s}
.acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;height:44px;border:3px solid #000;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-size:15px;letter-spacing:.03em;box-shadow:3px 3px 0 #000;background:var(--asph2);color:#fff;transition:transform .1s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.y{background:var(--gold);color:var(--ink)}
.btn small{font-family:var(--body);font-weight:700;font-size:11px;opacity:.75}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{text-align:left;background:var(--asph2);border:2.5px solid #000;padding:9px 10px;box-shadow:2px 2px 0 #000}
.opt.on{border-color:var(--gold);background:#2f2a1c}
.opt .t{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--display);font-size:15px}
.opt .r{font-family:var(--body);font-weight:800;font-size:11.5px;padding:1px 6px}
.opt .m{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.35}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.row{display:flex;align-items:center;gap:10px;background:var(--asph2);border:2px solid #000;padding:8px 10px;text-align:left;width:100%}
.row .ri{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .ri svg{width:16px;height:16px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .rn{flex:1;min-width:0}
.row .rn b{display:block;font-size:13.5px}
.row .rn span{font-size:11.5px;color:var(--mute)}
.row .rv{font-family:var(--display);font-size:14px;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.dis{opacity:.5}
.hint{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.4}
.rank{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:13px;font-weight:700}
.rank .p{font-family:var(--display);font-size:16px;width:16px;color:var(--dim)}
.rank .sw{width:12px;height:12px;border:2px solid #000;flex-shrink:0}
.rank .bar{flex:1;height:10px;background:var(--asph2);border:2px solid #000}.rank .bar i{display:block;height:100%}
.rank .n{width:84px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nav{height:62px;background:var(--asph);border:3px solid var(--ink);box-shadow:4px 4px 0 #000;display:flex;align-items:stretch}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--label);font-size:12.5px;letter-spacing:.1em;color:var(--dim)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--gold)}
.zoom{position:fixed;z-index:5;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 132px);display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;background:var(--asph);border:2.5px solid #000;box-shadow:2px 2px 0 #000;font-family:var(--display);font-size:18px}
.err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--mute)}
@media (prefers-reduced-motion: reduce){.toast,.panel{animation:none}}
/* 0.3: schmale iPhones (SE, 320 px) – Geldstreifen zweizeilig, damit die Hitze-Karte auf den Bildschirm passt */
@media (max-width:360px){
  .hud-in{gap:6px}
  .tape{font-size:15px;padding:3px 7px 2px;line-height:1.05}
  .tape small{display:block;font-size:10px;margin:0 0 1px}
  .heat{min-width:58px;padding:3px 6px 5px}
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Spielkarte Nürnberg-Laufamholz"></canvas>
<svg id="ov"></svg>
<div id="pins"></div>

<div class="hud"><div class="hud-in">
  <div class="tape" id="t-black"><small>SCHWARZ</small><span id="m-black">0 €</span></div>
  <div class="tape clean" id="t-clean"><small>SAUBER</small><span id="m-clean">0 €</span></div>
  <div class="heat" id="t-heat"><div class="k">HITZE<b id="m-heat">0</b></div><div class="bar"><i id="heatbar"></i></div></div>
</div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="zoom"><button type="button" id="z-in" aria-label="Hineinzoomen">+</button><button type="button" id="z-out" aria-label="Herauszoomen">−</button></div>

<div class="bottom">
  <div class="panel" id="panel" hidden></div>
  <nav class="nav" id="nav">
    <button type="button" data-tab="map" class="on"><svg viewBox="0 0 24 24"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>Karte</button>
    <button type="button" data-tab="shops"><svg viewBox="0 0 24 24"><path d="M4 9l1.5-4h13L20 9M4 9h16v10H4zM9 19v-5h6v5"/></svg>Läden</button>
    <button type="button" data-tab="build"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M10 21v-6h4v6"/></svg>Bauen</button>
    <button type="button" data-tab="gang"><svg viewBox="0 0 24 24"><path d="M3 18l2-10 4 4 3-6 3 6 4-4 2 10z"/></svg>Banden</button>
  </nav>
</div>

  (G.get(u)||[]).forEach(([v,d])=>{const nd=ud+wf(NP.get(u),NP.get(v),d);if(nd<(dist.get(v)??1e18)){dist.set(v,nd);prev.set(v,u);todo.add(v);}});}
  if(!dist.has(t))return null;const out=[];let c=t;while(c){out.unshift(NP.get(c));c=prev.get(c);}return out;}
function densify(raw,step=2.5){const out=[];raw.forEach((p,i)=>{if(i){const q=raw[i-1];const n=Math.ceil(Math.hypot(p[0]-q[0],p[1]-q[1])/step);for(let k=1;k<n;k++)out.push([q[0]+(p[0]-q[0])*k/n,q[1]+(p[1]-q[1])*k/n]);}out.push(p);});return out;}
function plen(pts){let L=0;for(let i=1;i<pts.length;i++)L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);return L;}

function hull(points){points=points.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const p of points){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(const p of points.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  return lo.slice(0,-1).concat(up.slice(0,-1));}
function grow(poly,d){let cx=0,cz=0;poly.forEach(p=>{cx+=p[0];cz+=p[1];});cx/=poly.length;cz/=poly.length;return poly.map(p=>{const dx=p[0]-cx,dz=p[1]-cz,l=Math.hypot(dx,dz)||1;return[p[0]+dx/l*d,p[1]+dz/l*d];});}
function inPoly(x,z,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>z)!==(b[1]>z))&&(x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}

/* --- Lieferung planen --- */
let planObjs=[];
function clearPlan(){planObjs.forEach(o=>scene.remove(o));planObjs=[];plan=null;$('ovR').innerHTML='';}
function inZone(x,z){return cops.some(c=>Math.hypot(c.x-x,c.z-z)<ZR);}
function riskOf(pts){const hit=new Set();pts.forEach(p=>cops.forEach((c,i)=>{if(Math.hypot(c.x-p[0],c.z-p[1])<ZR)hit.add(i);}));const p=.22+S.heat/300;return{hits:hit.size,risk:1-Math.pow(1-p,hit.size)};}
function buildRoute(h,safe){const s=nearestNode(LAGER.rd.px,LAGER.rd.pz),t=nearestNode(h.rd.px,h.rd.pz);
  const raw=dijkstra(s,t,(u,v,d)=>{if(!safe)return d;const mx=(u[0]+v[0])/2,mz=(u[1]+v[1])/2;return d*(inZone(mx,mz)||inZone(u[0],u[1])||inZone(v[0],v[1])?25:1);});
  if(!raw)return null;return densify([[LAGER.x,LAGER.z],[LAGER.rd.px,LAGER.rd.pz]].concat(raw).concat([[h.rd.px,h.rd.pz],[h.x,h.z]]));}
function drawRoute(pts,col,w,y,dashed){const grp=new T.Group();
  const top=g=>g.traverse(m=>{if(m.isMesh){m.renderOrder=5;m.material=m.material.clone();m.material.depthTest=false;m.material.transparent=true;}});
  const a=ribbon(pts,w+2,y,basic(0x141214),grp,false);const b=ribbon(pts,w,y+.05,basic(col),grp,false);top(grp);
  const sh=new T.Shape();sh.moveTo(-1.2,-1);sh.lineTo(1.4,0);sh.lineTo(-1.2,1);sh.lineTo(-.4,0);sh.closePath();const cg=new T.ShapeGeometry(sh);cg.rotateX(-Math.PI/2);
  const cl=[];for(let i=4;i<pts.length-2;i+=4){const p=pts[i-1],q=pts[i];cl.push({g:at(cg.clone(),q[0],y+.1,q[1],0,-Math.atan2(q[1]-p[1],q[0]-p[0])),col:0x141214});}
  if(cl.length){const m=new T.Mesh(bake(cl,false),new T.MeshBasicMaterial({vertexColors:true,depthTest:false,transparent:true}));m.renderOrder=6;grp.add(m);}
  scene.add(grp);return grp;}
const SPEED=14;
function planDelivery(h){clearPlan();const fast=buildRoute(h,false),safe=buildRoute(h,true);if(!fast){toast('','!','Keine Route gefunden','');return;}
  const opts=[{k:'fast',pts:fast}];if(safe&&plen(safe)-plen(fast)>8)opts.push({k:'safe',pts:safe});
  opts.forEach(o=>{o.len=plen(o.pts);o.time=o.len/SPEED;const r=riskOf(o.pts);o.risk=r.risk;o.hits=r.hits;});
  plan={h,opts,choice:opts.length>1&&opts[1].risk<opts[0].risk?1:0};renderPlan();}
function renderPlan(){if(!plan)return;const {h,opts}=plan;planObjs.forEach(o=>scene.remove(o));planObjs=[];
  opts.forEach((o,i)=>{if(i!==plan.choice)planObjs.push(drawRoute(o.pts,0x8d8496,2.2,.8));});planObjs.push(drawRoute(opts[plan.choice].pts,0xffd23f,3.4,.9));
  const s=h.shop,cap=shopCap(s);const qty=Math.min(10,S.lager.stock,cap-s.stock);const free=fleet.find(f=>!f.busy);
  const rc=r=>r<.15?'background:rgba(61,220,151,.18);color:#7ff0bf':r<.4?'background:rgba(255,210,63,.18);color:#ffd23f':'background:rgba(255,63,164,.2);color:#ff7fc4';
  openPanel(`<div class="hd"><div style="flex:1;min-width:0"><h2>LIEFERUNG</h2><div class="sub">Lager → ${s.name} · ${qty} Kisten</div></div></div>
  <div class="opts">${opts.map((o,i)=>`<button type="button" class="opt ${i===plan.choice?'on':''}" data-i="${i}"><div class="t">${o.k==='fast'?'Direkt':'Umweg'}<span class="r" style="${rc(o.risk)}">${Math.round(o.risk*100)} %</span></div><div class="m">${mmss(o.time)} min · ${Math.round(o.len)} m<br>${o.hits?o.hits+' Streife'+(o.hits>1?'n':'')+' auf dem Weg':'keine Streife'}</div></button>`).join('')}
  ${opts.length<2?'<div class="opt" style="opacity:.55"><div class="t">Umweg</div><div class="m">Kein sinnvoller Umweg. Direkt ist schon der sicherste Weg.</div></div>':''}</div>
  <div class="hint">Fahrer: ${free?free.name:'gerade keiner frei'} · Risiko steigt mit deiner Hitze (${Math.round(S.heat)}).</div>
  <div class="acts"><button class="btn" type="button" id="b-back">ZURÜCK</button><button class="btn y" type="button" id="b-go" ${(!free||qty<=0)?'disabled':''}>${!free?'KEIN WAGEN FREI':qty<=0?(S.lager.stock<=0?'LAGER LEER':'LADEN VOLL'):'LOSSCHICKEN'}</button></div>`);
  panel.querySelectorAll('.opt[data-i]').forEach(b=>b.onclick=()=>{plan.choice=+b.dataset.i;renderPlan();});
  $('b-back').onclick=()=>{clearPlan();showShop(h);};
  $('b-go').onclick=()=>{if(!free||qty<=0)return;send(free,h,opts[plan.choice],qty);clearPlan();closePanel();};}
function send(f,h,o,qty){f.busy=true;S.lager.stock-=qty;f.v.userData.cargo.forEach(c=>c.visible=true);
  const route=drawRoute(o.pts,0xffd23f,2.4,.85);route.traverse(m=>{if(m.material){m.material.opacity=.55;}});
  const cum=[0];for(let i=1;i<o.pts.length;i++)cum.push(cum[i-1]+Math.hypot(o.pts[i][0]-o.pts[i-1][0],o.pts[i][1]-o.pts[i-1][1]));
  S.deliveries.push({f,h,pts:o.pts,cum,len:cum[cum.length-1],s:0,phase:'go',qty,checked:new Set(),route,t:0});
  f.lab.hidden=false;toast('info','→',`${f.name} fährt los`,`${qty} Kisten an ${h.shop.name} · ${mmss(o.time)} min`);}
function posAt(d,s){const c=d.cum;let i=1;while(i<c.length-1&&c[i]<s)i++;const a=d.pts[i-1],b=d.pts[i];const t=(s-c[i-1])/Math.max(.001,c[i]-c[i-1]);return{x:a[0]+(b[0]-a[0])*t,z:a[1]+(b[1]-a[1])*t,ang:Math.atan2(b[0]-a[0],b[1]-a[1])};}
function updDeliveries(dt){for(let k=S.deliveries.length-1;k>=0;k--){const d=S.deliveries[k];const v=d.f.v;
  if(d.phase==='go'||d.phase==='back'){d.s+=SPEED*(d.phase==='back'?1.6:1)*dt;const s=d.phase==='go'?d.s:d.len-d.s;const p=posAt(d,Math.max(0,Math.min(d.len,s)));v.position.set(p.x,.3,p.z);v.rotation.y=p.ang+(d.phase==='back'?Math.PI:0);
    if(d.phase==='go'){cops.forEach((c,i)=>{if(!d.checked.has(i)&&Math.hypot(c.x-p.x,c.z-p.z)<ZR){d.checked.add(i);const pr=.22+S.heat/300;
      if(rnd()<pr){d.phase='back';d.s=d.len-d.s;S.heat=Math.min(100,S.heat+14);d.f.v.userData.cargo.forEach(c=>c.visible=false);bump('t-heat');
        toast('','!',`Kontrolle! ${d.f.name} wurde erwischt`,`${d.qty} Kisten beschlagnahmt · Hitze +14`);floatAt('BESCHLAGNAHMT','#ff3fa4',p.x,8,p.z);d.lost=true;}
      else{floatAt('Durchgewunken','#9df7c2',p.x,8,p.z,-40);S.heat=Math.min(100,S.heat+3);}}});}
    if(d.s>=d.len){if(d.phase==='go'){d.phase='unload';d.t=0;}else{d.f.busy=false;d.f.lab.hidden=true;v.position.set(d.f.home[0],.3,d.f.home[1]);scene.remove(d.route);S.deliveries.splice(k,1);if(selected===LAGER)showLager();}}
    d.f.lab.textContent=d.f.name+(d.phase==='go'?' · '+mmss((d.len-d.s)/SPEED):d.lost?' · erwischt':' · zurück');d.f.lab.classList.toggle('bad',!!d.lost);}
  else if(d.phase==='unload'){d.t+=dt;d.f.lab.textContent=d.f.name+' · lädt ab';v.position.y=.3+Math.abs(Math.sin(d.t*12))*.15;
    if(d.t>1.6){const s=d.h.shop;const add=Math.min(d.qty,shopCap(s)-s.stock);s.stock+=add;d.f.v.userData.cargo.forEach(c=>c.visible=false);floatAt('+'+add+' Kisten','#ffd23f',d.h.x,d.h.h+4,d.h.z);pop(d.h.g,d.h.sc);
      d.phase='back';d.s=0;scene.remove(d.route);if(selected===d.h)showShop(d.h);save();}}}}

let buildable=[];

let okOv=null,selOv=null;const okMat=tm(0x5fbf82,{polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}),selMat=tm(0xffd23f,{polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});

  const b=buildSel;openPanel(`<div class="hd"><div><h2>NEUER LADEN</h2><div class="sub">Haus an der ${streetOfXY(b.cx,b.cz)}</div></div></div>
    <div class="list">${Object.entries(TYPES).map(([k,t])=>`<button class="row ${S.clean<t.cost?'dis':''}" type="button" data-k="${k}" style="--c:#ffd23f"><span class="ri"><svg viewBox="0 0 24 24">${ICON[k]}</svg></span><span class="rn"><b>${t.label}</b><span>${t.desc}</span></span><span class="rv">${fmt(t.cost)}</span></button>`).join('')}</div>
    <div class="hint">Bezahlt wird mit sauberem Geld. Du hast ${fmt(S.clean)}.</div>`);setTab('build');
  panel.querySelectorAll('.row').forEach(r=>r.onclick=()=>build(r.dataset.k));}
function streetOfXY(x,z){return streetOf({x,z});}
function build(k){const t=TYPES[k],b=buildSel;if(S.clean<t.cost){toast('','!','Zu wenig sauberes Geld',`${t.label} kostet ${fmt(t.cost)}. Lass deine Läden waschen.`);return;}
  S.clean-=t.cost;setMoney();bump('t-clean');floatAt('− '+fmt(t.cost),'#ff7fc4',b.cx,10,b.cz);
  exitBuild();panel.hidden=true;setTab('map');
  // Baustelle
  const site=new T.Group();site.position.set(b.cx,0,b.cz);scene.add(site);const poleM=tm(0xd98c2b);
  for(let a=0;a<10;a++){const p=new T.Mesh(new T.BoxGeometry(.4,12,.4),poleM);const an=a/10*Math.PI*2;p.position.set(Math.cos(an)*9,40,Math.sin(an)*9);site.add(p);p.userData.t=a*.05;}
  b.hide=true;cityDirty=true;
  const t0=performance.now();const dust=[];
  anim(dt=>{const e=(performance.now()-t0)/1000;site.children.forEach(p=>{const k=Math.min(1,Math.max(0,(e-p.userData.t)/.5));p.position.y=40-34*bounce(k);});
    if(e>.6&&dust.length<10&&rnd()<.3){const m=new T.Mesh(new T.SphereGeometry(1,8,6),basic(0xe8dcc6,{transparent:true,opacity:.7}));m.position.set(b.cx+(rnd()-.5)*16,1,b.cz+(rnd()-.5)*16);scene.add(m);dust.push({m,t:0});}
    dust.forEach(d=>{d.t+=dt;d.m.position.y+=dt*3;d.m.scale.setScalar(1+d.t*3);d.m.material.opacity=Math.max(0,.7-d.t*.6);});
    if(e>2.4){scene.remove(site);dust.forEach(d=>scene.remove(d.m));
      const h=place(k,'me',b.i,{stock:0});pop(h.g,h.sc,true);rebuildTurf();floatAt(h.shop.name+' eröffnet!','#ffd23f',h.x,h.h+8,h.z);
      toast('good','✓',`${h.shop.name} hat eröffnet`,TYPES[k].cap?'Beliefere den Laden vom Lager aus.':'Wäscht ab sofort mit.');save();return true;}});}
function bounce(k){const n=7.5625,d=2.75;if(k<1/d)return n*k*k;if(k<2/d)return n*(k-=1.5/d)*k+.75;if(k<2.5/d)return n*(k-=2.25/d)*k+.9375;return n*(k-=2.625/d)*k+.984375;}

/* --- Banden --- */
function score(){return S.clean+S.black*.5+S.shops.length*4000;}
function showGang(){const me=score(),tb=S.tobi,mx=Math.max(me,tb,1);const goal=50000;
  openPanel(`<div class="hd"><div><h2>BANDEN</h2><div class="sub">Saison-Test · Ziel: ${fmt(goal)} sauberes Geld</div></div></div>
  <div class="rank"><span class="p">${me>=tb?1:2}</span><span class="sw" style="background:#ffd23f"></span><span style="width:60px">Du</span><span class="bar"><i style="width:${me/mx*100}%;background:#ffd23f"></i></span><span class="n">${fmt(me)}</span></div>
  <div class="rank"><span class="p">${me>=tb?2:1}</span><span class="sw" style="background:#9a7bff"></span><span style="width:60px">Tobi</span><span class="bar"><i style="width:${tb/mx*100}%;background:#9a7bff"></i></span><span class="n">${fmt(tb)}</span></div>
  <div class="grid2"><div><div class="mt">Sauber bis zum Ziel<b>${Math.min(100,Math.round(S.clean/goal*100))} %</b></div>${stockMeter(S.clean,goal,'var(--clean)')}</div><div><div class="mt">Hitze<b>${Math.round(S.heat)}</b></div>${stockMeter(S.heat,100,'var(--pink)')}</div></div>
  <div class="hint">Punkte = sauberes Geld + halbes Schwarzgeld + 4.000 € je Laden. Bei Hitze 100 gibt es eine Razzia.</div>
  <div class="acts"><button class="btn" type="button" id="b-reset">NEU STARTEN</button></div>`);setTab('gang');
  $('b-reset').onclick=()=>{try{localStorage.removeItem('frachtkartell-demo');}catch(e){}location.reload();};}

/* ================= Animationen & Effekte ================= */
const anims=[];function anim(fn){anims.push(fn);}
function pop(g,sc,big){const t0=performance.now();anim(()=>{const k=Math.min(1,(performance.now()-t0)/(big?600:400));const s=1+Math.sin(k*Math.PI*2)*(1-k)*(big?.25:.12);g.scale.set(sc/Math.sqrt(s),sc*s,sc/Math.sqrt(s));return k>=1;});}
const smokeM=basic(0xe7dff0,{transparent:true,opacity:.5});const puffGeo=new T.SphereGeometry(1,8,6);const puffs=[];let smokeT=0;

/* ================= Kamera-Steuerung ================= */
function applyCam(){const W=innerWidth,H=innerHeight;const vw=cam.w,vh=vw*H/W;camera.left=-vw/2;camera.right=vw/2;camera.top=vh/2;camera.bottom=-vh/2;
  cam.tx=Math.max(B[0]+40,Math.min(B[2]-40,cam.tx));cam.tz=Math.max(B[1]+10,Math.min(B[3]-10,cam.tz));
  camera.position.set(cam.tx+OFF.x,OFF.y,cam.tz+OFF.z);camera.lookAt(cam.tx,0,cam.tz);camera.updateProjectionMatrix();}
function fitStart(){cam.w=innerWidth<600?200:Math.min(420,200*(innerWidth/innerHeight)/(390/844)*.55);}
renderer.setSize(innerWidth,innerHeight,false);fitStart();applyCam();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);applyCam();});
let fly=null;function flyTo(x,z){fly={fx:cam.tx,fz:cam.tz,x:x-8,z:z,t:0};}
const ptrs=new Map();let dragStart=null,moved=0,pinchD=0,pinchW=0;
const ground0=new T.Plane(new T.Vector3(0,1,0),0);const ray=new T.Raycaster();
function worldAt(cx,cy){const v=new T.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(v,camera);const p=new T.Vector3();ray.ray.intersectPlane(ground0,p);return p;}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;fly=null;
  if(ptrs.size===1){dragStart={w:worldAt(e.clientX,e.clientY),tx:cam.tx,tz:cam.tz};}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinchD=Math.hypot(a.x-b.x,a.y-b.y);pinchW=cam.w;}canvas.classList.add('drag');});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);moved+=Math.hypot(e.clientX-p.x,e.clientY-p.y);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);cam.w=Math.max(80,Math.min(480,pinchW*pinchD/d));applyCam();return;}
  if(dragStart&&ptrs.size===1){cam.tx=dragStart.tx;cam.tz=dragStart.tz;applyCam();const w=worldAt(e.clientX,e.clientY);cam.tx=dragStart.tx+(dragStart.w.x-w.x);cam.tz=dragStart.tz+(dragStart.w.z-w.z);applyCam();}});
const endPtr=e=>{const wasTap=ptrs.size===1&&moved<8;ptrs.delete(e.pointerId);if(ptrs.size===0){dragStart=null;canvas.classList.remove('drag');}
  if(wasTap&&e.type==='pointerup')tapAt(e.clientX,e.clientY);};
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.w=Math.max(80,Math.min(480,cam.w*(1+Math.sign(e.deltaY)*.12)));applyCam();},{passive:false});
$('z-in').onclick=()=>{cam.w=Math.max(80,cam.w/1.25);applyCam();};$('z-out').onclick=()=>{cam.w=Math.min(480,cam.w*1.25);applyCam();};
function tapAt(cx,cy){const v=new T.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);ray.setFromCamera(v,camera);
  if(tab==='build'){const hit=ray.intersectObjects(buildable.map(b=>b.mesh))[0];if(hit){const b=hit.object.userData.bld;buildSel=b;showOverlay();showBuildPanel();}return;}
  const hs=[];heroes.forEach(h=>h.g.traverse(o=>{if(o.isMesh)hs.push(o);}));const hit=ray.intersectObjects(hs)[0];
  if(hit){let o=hit.object;const h=heroes.find(q=>{let f=false;q.g.traverse(m=>{if(m===o)f=true;});return f;});if(h){select(h);return;}}
  if(!panel.hidden&&tab==='map')closePanel();}

/* ================= Speichern ================= */
function save(){try{localStorage.setItem('frachtkartell-demo',JSON.stringify({black:S.black,clean:S.clean,heat:S.heat,tobi:S.tobi,lager:S.lager.stock,shops:S.shops.map(h=>({b:h.b.i,type:h.type,name:h.shop.name,level:h.shop.level,stock:h.shop.stock}))}));}catch(e){}}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem('frachtkartell-demo')||'null');}catch(e){}if(!d)return false;
  Object.assign(S,{black:d.black,clean:d.clean,heat:d.heat,tobi:d.tobi});S.lager.stock=d.lager;
  d.shops.forEach(s=>{const ex=S.shops.find(h=>h.b.i===s.b);if(ex){ex.shop.level=s.level;ex.shop.stock=s.stock;}else{place(s.type,'me',s.b,{name:s.name,level:s.level,stock:s.stock});}});rebuildTurf();return true;}
const loaded=load();

/* ================= Spielschleife ================= */
let washAcc=0,tobiT=30,saveT=0,razzia=false;
function econ(dt){
  const L=S.lager;L.t+=dt;if(L.t>=2.5){L.t=0;if(L.stock<L.cap)L.stock++;}
  S.shops.forEach(h=>{const s=h.shop,t=TYPES[s.type];if(!t.cap)return;if(s.stock<=0)return;s.sellT+=dt;const iv=t.sell/(1+.25*(s.level-1));
    if(s.sellT>=iv){s.sellT=0;s.stock--;S.black+=t.price;if(rnd()<.35)floatAt('+'+t.price+' €','#ffd23f',h.x,h.h+2,h.z,-40);}});
  washAcc+=dt;if(washAcc>=1){washAcc=0;const m=Math.min(S.black,washRate());S.black-=m;S.clean+=m;S.heat=Math.min(100,S.heat+m/900);}
  S.heat=Math.max(0,S.heat-.22*dt);
  S.tobi+=55*dt;
  if(S.heat>=100&&!razzia){razzia=true;const lost=Math.round(S.black*.5);S.black-=lost;S.heat=45;toast('','!','RAZZIA!',`Die Polizei hat ${fmt(lost)} Schwarzgeld mitgenommen. Hitze sinkt auf 45.`);bump('t-black');setTimeout(()=>razzia=false,4000);}
  if(!S.won&&S.clean>=50000){S.won=true;toast('good','★','Ziel erreicht: 50.000 € sauber','Du bist der Pate von Laufamholz. Spiel gern weiter.');}
  // Polizei
  copTimer-=dt;if(copTimer<=0){copTimer=35+rnd()*15;const want=S.heat>60?3:2;while(cops.length<want)addCop();cops.forEach(c=>moveCop(c,false));
    if(plan)planDelivery(plan.h);}
  // Tobi-Ereignisse
  tobiT-=dt;if(tobiT<=0){tobiT=45+rnd()*25;const r=rnd();
    if(r<.4){S.heat=Math.min(100,S.heat+8+(S.tobiAngry||0)*3);bump('t-heat');toast('','!','Tobi hat dich angeschwärzt','Anonymer Tipp bei der Polizei · Hitze +'+(8+(S.tobiAngry||0)*3),{label:'RACHE · 500 €',fn:()=>{if(S.black<500){toast('','!','Zu wenig Schwarzgeld','');return;}S.black-=500;S.tobi=Math.max(0,S.tobi-6000);setMoney();toast('good','✓','Retourkutsche sitzt','Tobi verliert 6.000 €.');}});}
    else if(r<.7){const shops=S.shops.filter(h=>TYPES[h.shop.type].cap&&h.shop.stock>2);if(shops.length){const h=shops[(rnd()*shops.length)|0];const n=Math.min(3,h.shop.stock);h.shop.stock-=n;toast('','!',`Tobis Leute haben ${h.shop.name} ausgeräumt`,`${n} Kisten weg. Stärker ausbauen hilft.`);floatAt('− '+n+' Kisten','#ff7fc4',h.x,h.h+4,h.z);}}
    else{toast('info','?','Tobi bietet einen Deal an','Er zahlt 1.500 € schwarz für 8 Kisten aus deinem Lager.',{label:'ANNEHMEN',fn:()=>{if(S.lager.stock<8){toast('','!','Zu wenig Ware im Lager','');return;}S.lager.stock-=8;S.black+=1500;S.tobi+=1500;setMoney();bump('t-black');toast('good','✓','Deal gemacht','+1.500 € Schwarzgeld.');}});}}
  saveT+=dt;if(saveT>5){saveT=0;save();}
}
let last=performance.now(),uiT=0;
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(cityDirty)rebuildCity();
  econ(dt);updDeliveries(dt);
  for(let i=anims.length-1;i>=0;i--)if(anims[i](dt))anims.splice(i,1);
  if(fly){fly.t=Math.min(1,fly.t+dt*2.2);const k=1-Math.pow(1-fly.t,3);cam.tx=fly.fx+(fly.x-fly.fx)*k;cam.tz=fly.fz+(fly.z-fly.fz)*k;applyCam();if(fly.t>=1)fly=null;}
  // Tobis LKW
  tS=(tS+9*dt)%tLen;{let acc=0;for(let i=1;i<tLoop.length;i++){const a=tLoop[i-1],b=tLoop[i];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(acc+L>=tS){const t=(tS-acc)/L;truck.position.set(a[0]+(b[0]-a[0])*t,.3,a[1]+(b[1]-a[1])*t);truck.rotation.y=Math.atan2(b[0]-a[0],b[1]-a[1]);break;}acc+=L;}}
  // Blaulicht
  const on=Math.floor(now/160)%2;cops.forEach(c=>{c.v.userData.l1.material.color.setHex(on?0xff3b3b:0x3a0c0c);c.v.userData.l2.material.color.setHex(on?0x101e40:0x3d7bff);c.glow.material.opacity=reduce?.8:.6+on*.3;});
  // Rauch & Trommeln
  if(!reduce){smokeT-=dt;if(smokeT<=0){smokeT=.5;heroes.filter(h=>h.type==='shisha').forEach(h=>{const p=h.g.localToWorld(h.g.userData.smoke.clone());const m=new T.Mesh(puffGeo,smokeM.clone());m.position.copy(p);scene.add(m);puffs.push({m,t:0});});}
    for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.t+=dt;p.m.position.y+=dt*2.2;p.m.position.x+=dt*.6;p.m.scale.setScalar(1+p.t*1.2);p.m.material.opacity=Math.max(0,.5-p.t*.2);if(p.t>2.5){scene.remove(p.m);p.m.material.dispose();puffs.splice(i,1);}}
    heroes.filter(h=>h.type==='wasch').forEach(h=>h.g.userData.drums.forEach(d=>d.rotation.z+=dt*6));}
  if(selected){selRing.rotation.z+=dt*.6;}
  renderer.render(scene,camera);
  // Overlay & Pins
  heroes.forEach(h=>{const s=scr(h.x,h.h+13,h.z);h.pin.style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,-100%)`;
    if(h.badge){if(h.type==='lager'){h.badge.textContent=S.lager.stock+'/'+S.lager.cap;h.badge.classList.toggle('low',S.lager.stock<10);}
      else if(TYPES[h.type].cap){const cap=shopCap(h.shop);h.badge.textContent=h.shop.stock+'/'+cap;h.badge.classList.toggle('low',h.shop.stock<=2);}else{h.badge.textContent=washRate()&&(TYPES.wasch.wash*h.shop.level)+' €/s';}}});
  fleet.forEach(f=>{if(f.lab.hidden)return;const s=scr(f.v.position.x,9,f.v.position.z);f.lab.style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,-100%)`;});
  const ck=[cam.tx,cam.tz,cam.w,innerWidth,innerHeight].map(v=>v.toFixed(2)).join('|')+'|'+turfVer;
  if(ck!==lastCk){lastCk=ck;
  streetEls.forEach(({el,s})=>{const pa=scr(s.a[0],0,s.a[1]),pb=scr(s.b[0],0,s.b[1]);let ang=Math.atan2(pb.y-pa.y,pb.x-pa.x)*180/Math.PI;if(ang>90)ang-=180;if(ang<-90)ang+=180;
    const len=Math.hypot(pb.x-pa.x,pb.y-pa.y);el.style.display=len<el.offsetWidth*.9?'none':'';el.style.transform=`translate(${(pa.x+pb.x)/2}px,${(pa.y+pb.y)/2}px) translate(-50%,-50%) rotate(${ang}deg)`;});
  }
  uiT+=dt;if(uiT>.25){uiT=0;setMoney();const ps=$('p-stock');if(ps&&selected&&selected.shop)ps.textContent=selected.shop.stock+'/'+shopCap(selected.shop);const pl=$('p-lager');if(pl)pl.textContent=S.lager.stock+'/'+S.lager.cap;}
  requestAnimationFrame(tick);}
setMoney();requestAnimationFrame(tick);
setTimeout(()=>toast('info','!',loaded?'Willkommen zurück':'Willkommen in Laufamholz',loaded?'Dein Spielstand wurde geladen.':'Tippe aufs Lager und beliefere Wolke 7. Echte Straßen, echte Häuser.'),600);
window.__game={buildableList:()=>buildable,renderer,S,heroes,select,planDelivery,LAGER,cops,fleet,enterBuild,blds,tapAt,showGang,build:(i,k)=>{buildSel=blds.find(b=>b.i===i);build(k);}};
}
})();
</script>
