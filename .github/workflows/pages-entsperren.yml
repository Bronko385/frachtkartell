# Einmalig (Swens Ja, 01.11.): hängende Pages-Bereitstellung von 0.5.1 abschließen. Wird danach wieder gelöscht.
name: Pages entsperren
on: workflow_dispatch
permissions:
  pages: write
  deployments: write
  contents: read
jobs:
  abbrechen:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=repos/${{ github.repository }}
          gh api "$R/deployments?environment=github-pages&per_page=10" --jq '.[] | "\(.id) \(.sha) \(.created_at)"'
          for d in $(gh api "$R/deployments?environment=github-pages&sha=cb4a8095ce157ba787464cef0c24e6c3c41d893c" --jq '.[].id'); do
            echo "Deployment $d Status vorher:"; gh api "$R/deployments/$d/statuses" --jq '.[] | "\(.state) \(.created_at)"'
            gh api -X POST "$R/deployments/$d/statuses" -f state=success -f description="haengende Bereitstellung abgeschlossen" --jq '.state'
          done
